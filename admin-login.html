<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Administración
    </title>

    <link
        rel="icon"
        href="data:,"
    >

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

<main class="card">

    <div class="logo">
        ADMINISTRACIÓN
    </div>

    <h1>
        Panel de asistencia
    </h1>

    <p class="subtitle">
        Ingrese sus credenciales administrativas.
    </p>


    <form id="adminLoginForm">

        <label for="usuario">
            Usuario
        </label>

        <input
            id="usuario"
            type="text"
            autocomplete="username"
            required
        >


        <label for="password">
            Contraseña
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >


        <button
            id="loginBtn"
            type="submit"
        >
            Ingresar
        </button>

    </form>


    <p
        id="mensaje"
        class="mensaje"
    ></p>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/admin-auth.js"></script>

</body>

</html>
