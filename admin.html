<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Panel administrativo
    </title>

    <link
        rel="icon"
        href="data:,"
    >

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>

<body>

<main>

    <header class="top">

        <div>

            <small>
                CONTROL DE ASISTENCIA
            </small>

            <h1>
                Panel administrativo
            </h1>

            <p id="adminNombre">
                Verificando acceso...
            </p>

        </div>


        <button
            id="cerrarSesionBtn"
            class="btn-secundario btn-cerrar"
        >
            Cerrar sesión
        </button>

    </header>


    <section
        id="panel"
        hidden
    >

        <!-- ===============================
             FILTROS
        ================================ -->

        <div class="card filtros">

            <div>

                <label for="tipoPeriodo">
                    Vista
                </label>

                <select id="tipoPeriodo">

                    <option value="dia">
                        Día
                    </option>

                    <option value="mes">
                        Mes completo
                    </option>

                </select>

            </div>


            <div id="campoDia">

                <label for="fecha">
                    Día
                </label>

                <input
                    type="date"
                    id="fecha"
                >

            </div>


            <div
                id="campoMes"
                hidden
            >

                <label for="mes">
                    Mes
                </label>

                <input
                    type="month"
                    id="mes"
                >

            </div>


            <div>

                <label for="departamento">
                    Departamento
                </label>

                <select id="departamento">

                    <option value="">
                        Todos
                    </option>

                </select>

            </div>


            <div>

                <label for="grado">
                    Grado
                </label>

                <select id="grado">

                    <option value="">
                        Todos
                    </option>

                    <option value="SV">
                        SV
                    </option>

                    <option value="AC">
                        AC
                    </option>

                </select>

            </div>


            <div class="boton-filtro">

                <button id="buscarBtn">
                    Mostrar
                </button>

            </div>

        </div>


        <!-- ===============================
             RESUMEN
        ================================ -->

        <div class="resumen">

            <div class="mini-card">

                <span id="labelCantidad">
                    Personal
                </span>

                <strong id="cantidad">
                    0
                </strong>

            </div>


            <div class="mini-card completo">

                <span>
                    Jornadas completas
                </span>

                <strong id="completos">
                    0
                </strong>

            </div>


            <div class="mini-card pendiente">

                <span>
                    Sin egreso
                </span>

                <strong id="sinEgreso">
                    0
                </strong>

            </div>


            <div class="mini-card faltante">

                <span>
                    Sin registro
                </span>

                <strong id="sinRegistro">
                    0
                </strong>

            </div>

        </div>


        <!-- ===============================
             EXPORTAR
        ================================ -->

        <div class="acciones">

            <button
                id="excelBtn"
                class="btn-exportar"
                disabled
            >
                Descargar Excel
            </button>

            <button
                id="pdfBtn"
                class="btn-exportar"
                disabled
            >
                Descargar PDF
            </button>

        </div>


        <p
            id="mensaje"
            class="mensaje"
        ></p>


        <!-- ===============================
             CONTENIDO DINÁMICO
        ================================ -->

        <div id="contenidoAsistencias"></div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<script src="js/config.js"></script>

<script src="js/admin.js"></script>

</body>

</html>
