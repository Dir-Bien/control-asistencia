<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Control de Asistencia
    </title>

    <link
        rel="icon"
        href="data:,"
    >

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

<main class="card">

    <div class="logo">
        CONTROL DE ASISTENCIA
    </div>

    <h1>
        Iniciar sesión
    </h1>

    <p class="subtitle">
        Ingresá con tu DNI y contraseña.
    </p>

    <form id="loginForm">

        <label for="dni">
            DNI
        </label>

        <input
            id="dni"
            type="text"
            inputmode="numeric"
            autocomplete="username"
            required
        >

        <label for="password">
            Contraseña
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button
            id="loginBtn"
            type="submit"
        >
            Ingresar
        </button>

    </form>

    <p
        id="mensaje"
        class="mensaje"
    ></p>



</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script>
    bloquearPC();
</script>
    
<script src="js/auth.js"></script>

</body>
</html>
