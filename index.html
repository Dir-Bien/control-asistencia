<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Control de Asistencia
    </title>

    <link
        rel="icon"
        href="data:,"
    >

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

<main class="card">

    <div class="logo">
        CONTROL DE ASISTENCIA
    </div>

    <h1>
        Iniciar sesión
    </h1>

    <p class="subtitle">
        Ingresá con tu DNI y contraseña.
    </p>

    <form id="loginForm">

        <label for="dni">
            DNI
        </label>

        <input
            id="dni"
            type="text"
            inputmode="numeric"
            autocomplete="username"
            required
        >

        <label for="password">
            Contraseña
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            required
        >
        <button id="mostrarPasswordBtn" class="mostrar-password" type="button" aria-pressed="false">Mostrar contraseña</button>

        <button
            id="loginBtn"
            type="submit"
        >
            Ingresar
        </button>

    </form>

    <p
        id="mensaje"
        class="mensaje"
    ></p>




    <div class="reporte-acceso"><button id="abrirReporteProblema" type="button" class="btn-reportar-problema">¿Tuviste un problema? Reportalo</button></div>
</main>

<dialog id="dialogoReporteProblema" class="modal-reporte" aria-labelledby="tituloReporteProblema">
  <div class="contenido-reporte">
    <div class="cabecera-reporte">
      <h2 id="tituloReporteProblema">Reportar un problema</h2>
      <button id="cerrarReporteProblema" type="button" class="cerrar-reporte" aria-label="Cerrar">×</button>
    </div>
    <p>Contanos qué ocurrió. Adjuntaremos automáticamente los últimos mensajes técnicos disponibles en este navegador, sin incluir contraseñas ni ubicación exacta.</p>
    <form id="formularioReporteProblema">
      <label for="fechaProblema">¿Cuándo ocurrió?</label>
      <input id="fechaProblema" name="fecha_problema" type="datetime-local" required>
      <label for="etapaProblema">¿En qué momento?</label>
      <select id="etapaProblema" name="etapa" required>
        <option value="abrir_app">Al abrir la página</option>
        <option value="login">Al iniciar sesión</option>
        <option value="ubicacion">Al solicitar ubicación</option>
        <option value="biometria">Al verificar huella / Face ID / PIN</option>
        <option value="ingreso">Al registrar ingreso</option>
        <option value="egreso">Al registrar egreso</option>
        <option value="otro">Otro</option>
      </select>
      <label for="dniProblema">DNI (opcional)</label>
      <input id="dniProblema" name="dni" type="text" inputmode="numeric" pattern="[0-9]{7,9}" maxlength="9" autocomplete="off" placeholder="Para identificar tu reporte">
      <label for="modeloCelularProblema">Modelo de celular (opcional)</label>
      <input id="modeloCelularProblema" name="modelo_celular" maxlength="90" placeholder="Ej.: iPhone 17, Samsung A54" autocomplete="off">
      <label for="sistemaCelularProblema">Versión de iOS / Android (opcional)</label>
      <input id="sistemaCelularProblema" name="sistema_celular" maxlength="80" placeholder="Ej.: iOS 26, Android 16" autocomplete="off">
      <div id="ubicacionReporteBox" class="ubicacion-reporte-box" hidden>
        <label class="ubicacion-reporte-permiso">
          <input type="checkbox" id="aceptarUbicacionReporte" name="aceptar_ubicacion">
          <span><strong>Compartir mi ubicación para revisar el error (opcional)</strong>
          Se solicitará permiso al enviar el reporte. Se guardarán las coordenadas, precisión y hora en un registro privado asociado al reporte. No es necesario aceptarlo para enviar el reporte.</span>
        </label>
      </div>
      <label for="descripcionProblema">¿Qué pasó?</label>
      <textarea id="descripcionProblema" name="descripcion" maxlength="1500" minlength="10" rows="4" required placeholder="Explicá qué estabas haciendo y qué mensaje te apareció. No escribas tu contraseña."></textarea>
      <button type="submit">Enviar reporte</button>
      <p id="estadoReporteProblema" class="mensaje" role="status" aria-live="polite"></p>
    </form>
  </div>
</dialog>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/reportar-problema.js"></script>

<script>
    bloquearPC();
</script>
    
<script src="js/auth.js"></script>

</body>
</html>
