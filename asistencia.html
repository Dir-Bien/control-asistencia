<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Mi Asistencia
    </title>

    <link
        rel="icon"
        href="data:,"
    >

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

<main class="card">


    <div class="logo">
        CONTROL DE ASISTENCIA
    </div>


    <h1 id="nombre">
        ...
    </h1>


    <p id="grado" class="subtitle">
        ...
    </p>


    <div class="datos">


        <div class="dato">

            <span>
                Departamento
            </span>

            <strong id="departamento">
                -
            </strong>

        </div>


        <div class="dato">

            <span>
                Fecha
            </span>

            <strong id="fecha">
                -
            </strong>

        </div>


        <div class="dato">

            <span>
                Turno
            </span>

            <strong id="turnoActual">
                -
            </strong>

        </div>


        <div class="dato">

            <span>
                Entrada
            </span>

            <strong id="entrada">
                -
            </strong>

        </div>


        <div class="dato">

            <span>
                Salida
            </span>

            <strong id="salida">
                -
            </strong>

        </div>

    </div>


    <div
        id="seleccionTurno"
        class="turno-box"
    >

        <label for="turno">
            ¿Qué turno hacés hoy?
        </label>


        <select id="turno">

            <option value="">
                Seleccionar
            </option>

            <option value="MANANA">
                Mañana
            </option>

            <option value="TARDE">
                Tarde
            </option>

        </select>

    </div>


    <button id="accionBtn">
        Cargando...
    </button>


    <p
        id="mensaje"
        class="mensaje"
    ></p>


    <p class="seguridad">
        Dispositivo registrado
    </p>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/asistencia.js"></script>

</body>

</html>
